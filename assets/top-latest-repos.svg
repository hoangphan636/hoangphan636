<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#120e1c" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c162b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0e0c17" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="amberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="laserNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="violetNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>

    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #ff5858; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 400; fill: #94a3b8; }
    .card-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
    .param-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
    .param-val { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 700; }

    /* 2-Second Scheduler Cycle (Total 6s: 3 cards x 2s each) */
    @keyframes cycleCard1L {
      0%, 33.33% { transform: translateY(-10px) scale(1.025); filter: drop-shadow(0 0 20px rgba(255, 8, 68, 0.55)); stroke: #ff0844; stroke-width: 2.2px; }
      33.34%, 100% { transform: translateY(0px) scale(1); filter: none; stroke: #2a223a; stroke-width: 1px; }
    }

    @keyframes cycleCard2L {
      0%, 33.33% { transform: translateY(0px) scale(1); filter: none; stroke: #2a223a; stroke-width: 1px; }
      33.34%, 66.66% { transform: translateY(-10px) scale(1.025); filter: drop-shadow(0 0 20px rgba(0, 198, 255, 0.55)); stroke: #00c6ff; stroke-width: 2.2px; }
      66.67%, 100% { transform: translateY(0px) scale(1); filter: none; stroke: #2a223a; stroke-width: 1px; }
    }

    @keyframes cycleCard3L {
      0%, 66.66% { transform: translateY(0px) scale(1); filter: none; stroke: #2a223a; stroke-width: 1px; }
      66.67%, 100% { transform: translateY(-10px) scale(1.025); filter: drop-shadow(0 0 20px rgba(248, 87, 166, 0.55)); stroke: #f857a6; stroke-width: 2.2px; }
    }

    /* 2-Second Progress Bar */
    @keyframes timerProgress2 {
      0% { width: 0px; }
      96% { width: 140px; }
      100% { width: 140px; }
    }

    /* Radar Beacon Pulse */
    @keyframes pulseLive2 {
      0% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.3; transform: scale(0.85); }
    }

    /* Realtime Ticker Pulse */
    @keyframes tickerPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    .card-1l { animation: cycleCard1L 6s infinite ease-in-out; transform-origin: 165px 205px; }
    .card-2l { animation: cycleCard2L 6s infinite ease-in-out; transform-origin: 470px 205px; }
    .card-3l { animation: cycleCard3L 6s infinite ease-in-out; transform-origin: 775px 205px; }
    .timer-bar2 { animation: timerProgress2 2s infinite linear; }
    .live-dot2 { animation: pulseLive2 2s infinite ease-in-out; transform-origin: 16px 15px; }
    .val-active { animation: tickerPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="936" height="366" rx="20" fill="url(#bgGrad2)" stroke="#2a223a" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#1b172a" stroke="#ff0844" stroke-width="1.5" />
    <polygon points="18,7 26,13 26,23 18,29 10,23 10,13" fill="none" stroke="#ff0844" stroke-width="2" />
    <circle cx="18" cy="18" r="4" fill="#ff0844" />

    <text x="48" y="19" class="header-title">⚡ LOẠI 2: TOP 3 REPO MỚI NHẤT</text>
    <text x="48" y="34" class="header-sub">NEWEST CODEBASES &amp; LATEST COMMITS • REALTIME 2S SCHEDULER</text>

    <!-- 2s Scheduler Realtime Indicator -->
    <g transform="translate(680, 2)">
      <rect x="0" y="0" width="195" height="32" rx="16" fill="#140f1f" stroke="#ff0844" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#ff0844" class="live-dot2" />
      <text x="28" y="20" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#ff5858">SCHEDULER: 2S TICKER</text>
      <!-- Progress Bar inside indicator -->
      <rect x="20" y="25" width="140" height="2" rx="1" fill="#2a223a" />
      <rect x="20" y="25" width="0" height="2" rx="1" fill="#ff0844" class="timer-bar2" />
    </g>
  </g>

  <!-- ==================== CARD 1 ==================== -->
  <g class="card-1l">
    <rect x="30" y="80" width="275" height="260" rx="16" fill="url(#cardGrad2)" stroke="#2a223a" stroke-width="1" filter="url(#cardShadow2)" />
    <path d="M 30 96 A 16 16 0 0 1 46 80 L 289 80 A 16 16 0 0 1 305 96 L 305 86 L 30 86 Z" fill="url(#amberNeon)" />

    <!-- Rank & Badge -->
    <rect x="46" y="96" width="38" height="20" rx="6" fill="#1b172a" stroke="#ff0844" stroke-width="1" />
    <text x="65" y="110" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#ff0844" text-anchor="middle">NEW</text>
    <g transform="translate(195, 96)">
      <rect x="0" y="0" width="94" height="20" rx="6" fill="#2d121b" stroke="#ff0844" stroke-width="0.8" />
      <text x="47" y="13.5" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#ff7675" text-anchor="middle">OCTOBER 2026</text>
    </g>

    <!-- Title & Desc -->
    <text x="46" y="142" class="card-title">Rule-Agent</text>
    <text x="46" y="164" class="card-desc">Intelligent autonomous agent engine</text>
    <text x="46" y="180" class="card-desc">governing QA validation &amp; test assertions.</text>

    <!-- Tags -->
    <g transform="translate(46, 196)">
      <rect x="0" y="0" width="85" height="20" rx="5" fill="#2d121b" stroke="#ff0844" stroke-width="0.8" />
      <text x="42.5" y="14" fill="#ff7675" class="card-tag" text-anchor="middle">Rule Engine</text>

      <rect x="93" y="0" width="70" height="20" rx="5" fill="#1c1a35" stroke="#a29bfe" stroke-width="0.8" />
      <text x="128" y="14" fill="#a29bfe" class="card-tag" text-anchor="middle">AI Agent</text>
    </g>

    <!-- Realtime Metric Tickers (2s Live Parameters) -->
    <rect x="46" y="230" width="243" height="58" rx="8" fill="#100b17" stroke="#2a223a" stroke-width="0.8" />
    <text x="56" y="247" class="param-label">LAST UPDATE</text>
    <text x="56" y="264" class="param-val val-active" fill="#ff7675">TODAY [LIVE]</text>
    <text x="160" y="247" class="param-label">BUILD STATUS</text>
    <text x="160" y="264" class="param-val val-active" fill="#00f5a0">100% HEALTHY</text>
    <text x="56" y="278" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#475569">SYNC: TICK 2S • REPO: PRIVATE CORE</text>

    <!-- Footer -->
    <line x1="46" y1="300" x2="289" y2="300" stroke="#2a223a" stroke-width="1" />
    <text x="46" y="322" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ff5858">STATUS: ACTIVE SPRINT</text>
    <circle cx="275" cy="318" r="4" fill="#ff0844" />
  </g>

  <!-- ==================== CARD 2 ==================== -->
  <g class="card-2l">
    <rect x="335" y="80" width="275" height="260" rx="16" fill="url(#cardGrad2)" stroke="#2a223a" stroke-width="1" filter="url(#cardShadow2)" />
    <path d="M 335 96 A 16 16 0 0 1 351 80 L 594 80 A 16 16 0 0 1 610 96 L 610 86 L 335 86 Z" fill="url(#laserNeon)" />

    <!-- Rank & Badge -->
    <rect x="351" y="96" width="32" height="20" rx="6" fill="#0f172a" stroke="#00c6ff" stroke-width="1" />
    <text x="367" y="110" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#00c6ff" text-anchor="middle">#2</text>
    <g transform="translate(500, 96)">
      <rect x="0" y="0" width="94" height="20" rx="6" fill="#0a223a" stroke="#00c6ff" stroke-width="0.8" />
      <text x="47" y="13.5" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00c6ff" text-anchor="middle">OCTOBER 2026</text>
    </g>

    <!-- Title & Desc -->
    <text x="351" y="142" class="card-title">playwright-agent-mcp</text>
    <text x="351" y="164" class="card-desc">Model Context Protocol server for</text>
    <text x="351" y="180" class="card-desc">automated browser QA &amp; testing agent.</text>

    <!-- Tags -->
    <g transform="translate(351, 196)">
      <rect x="0" y="0" width="75" height="20" rx="5" fill="#0c2538" stroke="#00c6ff" stroke-width="0.8" />
      <text x="37.5" y="14" fill="#38bdf8" class="card-tag" text-anchor="middle">MCP Spec</text>

      <rect x="83" y="0" width="85" height="20" rx="5" fill="#201538" stroke="#a855f7" stroke-width="0.8" />
      <text x="125.5" y="14" fill="#c084fc" class="card-tag" text-anchor="middle">Playwright</text>
    </g>

    <!-- Realtime Metric Tickers (2s Live Parameters) -->
    <rect x="351" y="230" width="243" height="58" rx="8" fill="#100b17" stroke="#2a223a" stroke-width="0.8" />
    <text x="361" y="247" class="param-label">LAST UPDATE</text>
    <text x="361" y="264" class="param-val val-active" fill="#38bdf8">TODAY [LIVE]</text>
    <text x="475" y="247" class="param-label">RUNNERS</text>
    <text x="475" y="264" class="param-val val-active" fill="#00f5a0">MULTI-ENGINE</text>
    <text x="361" y="278" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#475569">SYNC: TICK 2S • MCP PROTOCOL READY</text>

    <!-- Footer -->
    <line x1="351" y1="300" x2="594" y2="300" stroke="#2a223a" stroke-width="1" />
    <text x="351" y="322" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">INTEGRATION: MCP AGENT</text>
    <circle cx="580" cy="318" r="4" fill="#00c6ff" />
  </g>

  <!-- ==================== CARD 3 ==================== -->
  <g class="card-3l">
    <rect x="640" y="80" width="275" height="260" rx="16" fill="url(#cardGrad2)" stroke="#2a223a" stroke-width="1" filter="url(#cardShadow2)" />
    <path d="M 640 96 A 16 16 0 0 1 656 80 L 899 80 A 16 16 0 0 1 915 96 L 915 86 L 640 86 Z" fill="url(#violetNeon)" />

    <!-- Rank & Badge -->
    <rect x="656" y="96" width="32" height="20" rx="6" fill="#1b172a" stroke="#f857a6" stroke-width="1" />
    <text x="672" y="110" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#f857a6" text-anchor="middle">#3</text>
    <g transform="translate(795, 96)">
      <rect x="0" y="0" width="94" height="20" rx="6" fill="#2e1222" stroke="#f857a6" stroke-width="0.8" />
      <text x="47" y="13.5" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#f857a6" text-anchor="middle">OCTOBER 2026</text>
    </g>

    <!-- Title & Desc -->
    <text x="656" y="142" class="card-title">Format-CV</text>
    <text x="656" y="164" class="card-desc">Automated professional CV formatting &amp;</text>
    <text x="656" y="180" class="card-desc">profile compilation engine for engineers.</text>

    <!-- Tags -->
    <g transform="translate(656, 196)">
      <rect x="0" y="0" width="85" height="20" rx="5" fill="#2e1222" stroke="#f857a6" stroke-width="0.8" />
      <text x="42.5" y="14" fill="#f857a6" class="card-tag" text-anchor="middle">Automation</text>

      <rect x="93" y="0" width="70" height="20" rx="5" fill="#1c1a35" stroke="#a29bfe" stroke-width="0.8" />
      <text x="128" y="14" fill="#a29bfe" class="card-tag" text-anchor="middle">Tooling</text>
    </g>

    <!-- Realtime Metric Tickers (2s Live Parameters) -->
    <rect x="656" y="230" width="243" height="58" rx="8" fill="#100b17" stroke="#2a223a" stroke-width="0.8" />
    <text x="666" y="247" class="param-label">LAST UPDATE</text>
    <text x="666" y="264" class="param-val val-active" fill="#f857a6">WEEKLY SYNC</text>
    <text x="770" y="247" class="param-label">PIPELINE</text>
    <text x="770" y="264" class="param-val val-active" fill="#00f5a0">STANDARDIZED</text>
    <text x="666" y="278" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#475569">SYNC: TICK 2S • ATS-READY TEMPLATES</text>

    <!-- Footer -->
    <line x1="656" y1="300" x2="899" y2="300" stroke="#2a223a" stroke-width="1" />
    <text x="656" y="322" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#f857a6">OUTPUT: PRODUCTION</text>
    <circle cx="885" cy="318" r="4" fill="#f857a6" />
  </g>
</svg>
