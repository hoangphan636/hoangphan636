<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#30363D" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Container -->
  <rect width="878" height="148" x="1" y="1" rx="8" ry="8" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1" />
  <rect width="878" height="148" x="1" y="1" rx="8" ry="8" fill="url(#dotGrid)" />

  <!-- Status Indicator -->
  <g transform="translate(32, 28)">
    <circle cx="4" cy="4" r="3.5" fill="#3FB950" />
    <text x="14" y="7.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#8B949E" letter-spacing="0.8px">SYSTEMS QUALITY ARCHITECT &amp; AUTOMATION LEAD</text>
  </g>

  <!-- Name -->
  <text x="32" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F0F6FC" letter-spacing="-0.5px">Hoang Phan</text>

  <!-- Tagline / Professional Position -->
  <text x="32" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8B949E">Architecting deterministic E2E test platforms, AI-guided selector validation, and high-concurrency load pipelines.</text>

  <!-- Competency Tags -->
  <g transform="translate(32, 116)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="86" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="43" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#58A6FF">Playwright</text>

    <!-- Tag 2 -->
    <rect x="94" y="0" width="94" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="141" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#58A6FF">Appium 2.x</text>

    <!-- Tag 3 -->
    <rect x="196" y="0" width="102" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="247" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#58A6FF">TypeScript</text>

    <!-- Tag 4 -->
    <rect x="306" y="0" width="108" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="360" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#8B949E">k6 Performance</text>

    <!-- Tag 5 -->
    <rect x="422" y="0" width="108" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="476" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#8B949E">CI/CD Gates</text>
  </g>

  <!-- Right Decorative Icon / Badge -->
  <g transform="translate(800, 32)">
    <circle cx="28" cy="28" r="24" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <!-- Checkmark Shield / Quality Icon -->
    <path d="M28 14 L39 19 V28 C39 35 34 40 28 43 C22 40 17 35 17 28 V19 Z" fill="none" stroke="#58A6FF" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M23 28 L27 32 L34 24" fill="none" stroke="#58A6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
