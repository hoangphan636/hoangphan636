<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0c1022" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>

    <!-- Scanline Filter -->
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.45; }
      100% { transform: translateY(270px); opacity: 0.15; }
    }
    @keyframes neonPulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 28px rgba(0, 242, 254, 0.85)); }
    }
    .main-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 58px; font-weight: 900; letter-spacing: 5px; fill: url(#textGrad); }
    .sub-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 2px; fill: url(#subGrad); }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #e2e8f0; }
    .scan-beam { animation: scanline 4s infinite linear; }
    .pulse-glow { animation: neonPulse 3s infinite ease-in-out; }
  </style>

  <!-- Background Box -->
  <rect x="2" y="2" width="1196" height="276" rx="20" fill="url(#bannerBg)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- 3D Perspective Grid Background -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.35">
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="245" x2="1200" y2="245" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    
    <line x1="100" y1="280" x2="450" y2="180" />
    <line x1="250" y1="280" x2="500" y2="180" />
    <line x1="400" y1="280" x2="550" y2="180" />
    <line x1="600" y1="280" x2="600" y2="180" />
    <line x1="800" y1="280" x2="650" y2="180" />
    <line x1="950" y1="280" x2="700" y2="180" />
    <line x1="1100" y1="280" x2="750" y2="180" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="120" fill="#00f2fe" opacity="0.08" filter="url(#bannerGlow)" />
  <circle cx="1050" cy="140" r="140" fill="#b224ef" opacity="0.08" filter="url(#bannerGlow)" />

  <!-- Scanning Beam -->
  <line x1="10" y1="0" x2="1190" y2="0" stroke="#00f2fe" stroke-width="1.5" class="scan-beam" />

  <!-- Header Content -->
  <g transform="translate(600, 105)" text-anchor="middle">
    <!-- Main Title -->
    <text x="0" y="0" class="main-name pulse-glow">HOANG PHAN</text>
    <text x="0" y="42" class="sub-role">SENIOR QA AUTOMATION ENGINEER • PRINCIPAL QUALITY ARCHITECT</text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1px">Playwright + TypeScript • Appium Mobile • Performance Engineering (k6) • CI/CD Quality Gates</text>
  </g>

  <!-- Bottom Pills -->
  <g transform="translate(600, 222)" text-anchor="middle">
    <g transform="translate(-330, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0c1e30" stroke="#00f2fe" stroke-width="1" />
      <text x="0" y="5" class="pill-text" fill="#00f2fe">🎭 PLAYWRIGHT TS</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#201036" stroke="#b224ef" stroke-width="1" />
      <text x="0" y="5" class="pill-text" fill="#c084fc">📱 APPIUM 2.X</text>
    </g>
    <g transform="translate(110, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1e1832" stroke="#7D4EFA" stroke-width="1" />
      <text x="0" y="5" class="pill-text" fill="#a78bfa">⚡ K6 &amp; ARTILLERY</text>
    </g>
    <g transform="translate(330, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0a261e" stroke="#00f5a0" stroke-width="1" />
      <text x="0" y="5" class="pill-text" fill="#00f5a0">🚀 CI/CD SHARDING</text>
    </g>
  </g>
</svg>
